name: CI & Build Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python - m pip install --upgrade pip
          pip install ruff pytest jinja2

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest
        run: pytest -v

build:
  needs: lint-and-test
  runs-on: ubuntu-latest
  steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python - m pip install --upgrade pip
        pip install jinja2

    - name: Compile studio HTML
      run: python build.py

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_site"